<title>Hall of Athlète</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout concept : cockpit "Performance Tech" — profil athlète à gauche (stats en direct),
   scène centrale qui se transforme en arène de mini-jeu, HUD énergie/argent en haut. */
:root{
  color-scheme:dark;
  --bg:#060a11; --bg-2:#0a101a;
  --card:rgba(16,24,38,.66); --card-solid:#0e1624;
  --line:rgba(150,180,255,.13); --line-2:rgba(150,180,255,.26);
  --fg:#e9eefb; --muted:#93a1bf; --dim:#5d6b88;
  --force:#ff7a45; --speed:#4ea6ff; --endu:#b48cff; --agi:#46e08a; --prec:#ff5fa8; --ment:#f2e35b;
  --accent:#5ff2d0; --gold:#ffcc55; --ok:#4be3a0; --bad:#ff5470;
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
html,body{background:var(--bg)}
body{
  margin:0; color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.5;
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 520px at 88% -8%, rgba(78,166,255,.16), transparent 60%),
    radial-gradient(760px 520px at -6% 18%, rgba(180,140,255,.12), transparent 60%),
    radial-gradient(700px 400px at 50% 110%, rgba(95,242,208,.07), transparent 60%);
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:18px 40px;
}
body::after{ /* grille technique discrète */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px; opacity:.25;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%); mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);
}
.shell{position:relative; z-index:1; max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
kbd{font-family:var(--f-mono); font-size:.8em; padding:2px 7px; border-radius:6px; border:1px solid var(--line-2); background:rgba(255,255,255,.05)}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Cartes verre ---------- */
.glass{background:var(--card); border:1px solid var(--line); border-radius:20px;
  -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 24px 60px -34px rgba(0,0,0,.9)}
.label{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}

/* ---------- Topbar ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#04120f;
  background:linear-gradient(135deg,var(--accent),var(--speed)); box-shadow:0 0 28px -4px var(--accent)}
.brand b{font:800 italic 28px/1 var(--f-display); letter-spacing:.02em; display:block}
.brand b span{color:var(--accent)}
.brand small{display:block; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim); margin-top:3px}
.hud{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.pill{display:flex; align-items:center; gap:10px; padding:8px 14px; border-radius:14px; background:var(--card); border:1px solid var(--line)}
.pill .v{font:700 15px var(--f-mono); font-variant-numeric:tabular-nums}
.pill.quota{gap:12px}
.pill.quota small{font-size:11px; color:var(--muted); white-space:nowrap}
.pips{display:flex; gap:5px}
.pips i{width:12px; height:12px; border-radius:4px; background:rgba(255,255,255,.1); transition:.3s}
.pips i.on{background:var(--accent); box-shadow:0 0 10px var(--accent)}
.pill.money{color:var(--gold)}
.pill.money .v{color:var(--fg)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted);transition:.2s}
.icon-btn:hover{color:var(--fg); border-color:var(--line-2)}
.icon-btn.armed{color:var(--bad); border-color:var(--bad); width:auto; padding:0 12px; font-size:12px; font-weight:700}

/* ---------- Layout ---------- */
.layout{display:grid; gap:18px; grid-template-columns:minmax(0,1fr)}
.side{display:flex; flex-direction:column; gap:14px; min-width:0; order:2}
.main{min-width:0; order:1; display:flex; flex-direction:column; gap:14px}
@media(min-width:1000px){
  .layout{grid-template-columns:340px minmax(0,1fr); align-items:start}
  .side{order:0}
  .main{order:0}
}

/* ---------- Barres ---------- */
.bar{--c:var(--accent); height:10px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; position:relative}
.bar>i{display:block; height:100%; width:var(--w,0%); border-radius:inherit; position:relative;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent),var(--c));
  box-shadow:0 0 16px -1px var(--c); transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar>i::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%); background-size:200% 100%; animation:shine 3.2s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.fast .bar>i{transition-duration:.12s}

/* ---------- Profil ---------- */
.profile{padding:18px; display:flex; gap:16px; align-items:center}
.ringwrap{position:relative; width:112px; height:112px; flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.rtrk{fill:none; stroke:rgba(255,255,255,.07); stroke-width:9}
.rarc{fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); filter:drop-shadow(0 0 7px rgba(95,242,208,.7))}
.ringc{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.ringc small{font-size:9px; letter-spacing:.2em; color:var(--muted); font-weight:700}
.ringc b{font:800 italic 44px/1 var(--f-display)}
.nameIn{width:100%; background:transparent; border:0; border-bottom:1px dashed var(--line-2); color:var(--fg); font:800 italic 24px/1.2 var(--f-display); letter-spacing:.02em; padding:2px 0; outline:none; text-transform:uppercase}
.nameIn:focus-visible{border-bottom-color:var(--accent)}
.rank{margin-top:6px; display:inline-flex; gap:6px; align-items:center; font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); padding:4px 10px; border-radius:99px; background:rgba(95,242,208,.1); border:1px solid rgba(95,242,208,.3)}
.statcard{padding:18px; display:flex; flex-direction:column; gap:16px}
.srow .top{display:flex; align-items:center; gap:8px; margin-bottom:7px}
.srow .nm{font:700 italic 19px/1 var(--f-display); letter-spacing:.04em; text-transform:uppercase}
.srow .val{margin-left:auto; font:700 17px var(--f-mono)}
.srow .val small{color:var(--dim); font-size:11px}
.srow .sub{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--dim)}
.srow .sub em{font-style:normal; color:var(--ok)}
.srow svg{color:var(--c)}
.boostchip{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:14px; border:1px dashed var(--line-2); color:var(--muted); font-size:12.5px}
.boostchip.on{border:1px solid rgba(95,242,208,.45); background:rgba(95,242,208,.08); color:var(--fg); box-shadow:0 0 24px -10px var(--accent)}
.boostchip.on svg{color:var(--accent)}
.gear{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.gslot{padding:10px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.025); display:flex; gap:10px; align-items:center; min-width:0}
.gslot .gi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--dim);flex:none}
.gslot.on .gi{color:var(--accent); background:rgba(95,242,208,.12); box-shadow:0 0 16px -4px var(--accent)}
.gslot b{display:block; font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gslot small{display:block; font-size:10.5px; color:var(--dim)}
.recs{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; font-size:12px; color:var(--muted)}
.recs b{color:var(--fg); font-family:var(--f-mono)}

/* ---------- Onglets ---------- */
.tabs{display:flex; gap:6px; padding:6px; border-radius:16px; background:var(--card); border:1px solid var(--line); overflow-x:auto}
.tab{flex:1; min-width:max-content; display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 16px; border-radius:11px; border:0; background:transparent; color:var(--muted); font-weight:700; font-size:13.5px; transition:.2s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:#04120f; background:linear-gradient(135deg,var(--accent),var(--speed)); box-shadow:0 8px 24px -10px var(--accent)}
.tab[disabled]{opacity:.4; cursor:not-allowed}

/* ---------- Boutons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:13px; border:0; font-weight:800; font-size:14px; color:#04120f;
  background:linear-gradient(135deg,var(--accent),var(--speed)); box-shadow:0 10px 28px -12px var(--accent); transition:transform .15s, box-shadow .2s, filter .2s}
.btn:hover{transform:translateY(-1px); box-shadow:0 14px 34px -10px var(--accent); filter:brightness(1.06)}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.35; cursor:not-allowed; transform:none; box-shadow:none; filter:grayscale(.6)}
.btn.ghost{background:rgba(255,255,255,.05); color:var(--fg); box-shadow:none; border:1px solid var(--line-2)}
.btn.ghost:hover{background:rgba(255,255,255,.09); box-shadow:none}
.btn.sm{padding:8px 14px; font-size:12.5px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- Entraînement ---------- */
.cards{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.gcard{--c:var(--accent); padding:20px; display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden; transition:.25s}
.gcard::before{content:""; position:absolute; width:220px; height:220px; right:-90px; top:-90px; border-radius:50%; background:radial-gradient(circle,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%); opacity:.7; transition:.3s}
.gcard:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent); transform:translateY(-3px)}
.gcard:hover::before{opacity:1; transform:scale(1.15)}
.gic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 0 24px -6px var(--c)}
.gic svg{width:26px;height:26px}
.gcard h3{margin:0; font:800 italic 26px/1.05 var(--f-display); letter-spacing:.02em; text-transform:uppercase}
.gcard p{margin:0; color:var(--muted); font-size:13.5px}
.gtag{font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--c)}
.gmeta{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-top:auto}
.gmeta span{display:inline-flex; gap:5px; align-items:center}
.gmeta b{color:var(--fg); font-family:var(--f-mono)}

/* ---------- Arène ---------- */
.arena{--c:var(--accent); position:relative; overflow:hidden; padding:clamp(16px,3vw,28px); min-height:560px; display:flex; flex-direction:column; gap:14px}
.arena::before{content:""; position:absolute; inset:-30% -10% auto -10%; height:80%; background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--c) 26%,transparent),transparent 65%); pointer-events:none}
.arena>*{position:relative}
.atop{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:8px; padding:7px 13px; border-radius:99px; background:color-mix(in srgb,var(--c) 14%,transparent); border:1px solid color-mix(in srgb,var(--c) 45%,transparent); color:var(--c); font-weight:800; font-size:12px; letter-spacing:.1em; text-transform:uppercase}
.abody{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center}
.hint{margin:0; color:var(--muted); font-size:13px}
.timer{position:relative; width:min(250px,58vw); aspect-ratio:1}
.timer svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.timer .trk{fill:none; stroke:rgba(255,255,255,.07); stroke-width:6}
.timer .prg{fill:none; stroke:var(--c); stroke-width:6; stroke-linecap:round; stroke-dasharray:339.29; stroke-dashoffset:0; filter:drop-shadow(0 0 8px var(--c))}
.tnum{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.tnum b{font:700 clamp(46px,11vw,74px)/1 var(--f-mono); letter-spacing:-.05em; font-variant-numeric:tabular-nums; text-shadow:0 0 28px color-mix(in srgb,var(--c) 70%,transparent)}
.tnum small{font-size:11px; letter-spacing:.3em; color:var(--muted); text-transform:uppercase; margin-top:2px}
.timer.low .prg{stroke:var(--bad)} .timer.low b{color:var(--bad)}
.count-big{display:flex;flex-direction:column;align-items:center}
.count-big b{font:800 italic clamp(60px,12vw,108px)/1 var(--f-display); text-shadow:0 0 40px color-mix(in srgb,var(--c) 60%,transparent)}
.count-big small{font-size:11px; letter-spacing:.28em; color:var(--muted); font-weight:700}
.countdown{position:absolute!important; inset:0; z-index:5; display:grid; place-items:center; background:rgba(6,10,17,.66); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px)}
.countdown span{font:800 italic clamp(130px,30vw,260px)/1 var(--f-display); color:var(--c); text-shadow:0 0 70px var(--c); animation:cd .8s ease-out both}
@keyframes cd{from{transform:scale(1.7);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:.92}}
.wrap-rel{position:relative; display:grid; place-items:center}
.bigbtn{--c:var(--force); width:min(230px,52vw); aspect-ratio:1; border-radius:50%; border:0; color:#2a0e03; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  font:800 italic 38px var(--f-display); letter-spacing:.04em;
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 52%,color-mix(in srgb,var(--c) 45%,#000));
  box-shadow:0 0 0 10px rgba(255,255,255,.04), 0 0 80px -8px var(--c), inset 0 -10px 24px rgba(0,0,0,.3); transition:transform .06s}
.bigbtn:active,.bigbtn.down{transform:scale(.92)}
.pop{position:absolute; left:50%; top:30%; font:800 italic 30px var(--f-display); color:var(--c); pointer-events:none; text-shadow:0 0 14px var(--c); animation:pop .7s ease-out forwards; margin-left:var(--x,0)}
@keyframes pop{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-110px) scale(1.25);opacity:0}}
.pace{width:min(460px,100%)}
.pace .hd{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px}
.pace .bar{height:12px}
.pad-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(520px,100%)}
.pad{--c:var(--speed); padding:26px 10px; border-radius:20px; border:1px solid color-mix(in srgb,var(--c) 40%,transparent); background:color-mix(in srgb,var(--c) 10%,transparent); color:var(--fg); display:flex; flex-direction:column; align-items:center; gap:4px; touch-action:manipulation; user-select:none; -webkit-user-select:none; transition:transform .05s, background .1s, box-shadow .1s}
.pad span{font:800 italic 56px/1 var(--f-display)}
.pad small{font-size:11px; letter-spacing:.14em; color:var(--muted)}
.pad.lit{background:color-mix(in srgb,var(--c) 45%,transparent); box-shadow:0 0 44px -4px var(--c); transform:scale(.97)}
.pad.err{background:rgba(255,84,112,.35); border-color:var(--bad); box-shadow:0 0 36px -4px var(--bad)}
.gauge{position:relative; width:min(520px,100%); height:22px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; border:1px solid var(--line)}
.gauge .zone{position:absolute; top:0; bottom:0; background:repeating-linear-gradient(135deg,rgba(95,242,208,.28) 0 6px,rgba(95,242,208,.12) 6px 12px); border-inline:2px solid var(--accent)}
.gauge .fill{position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),var(--c)); box-shadow:0 0 18px var(--c)}
.gauge.in .fill{background:linear-gradient(90deg,var(--accent),#fff); box-shadow:0 0 24px var(--accent)}
.gscale{display:flex; justify-content:space-between; width:min(520px,100%); font:500 10px var(--f-mono); color:var(--dim); margin-top:-8px}
.inline-stats{display:flex; gap:24px; flex-wrap:wrap; justify-content:center}
.cv{width:min(600px,100%); aspect-ratio:16/10; border-radius:20px; background:radial-gradient(ellipse at 50% 50%,rgba(180,140,255,.12),rgba(6,10,17,.4)); border:1px solid var(--line); touch-action:manipulation; display:block}
.fx-flash{animation:flash .25s}
@keyframes flash{from{box-shadow:0 0 0 0 transparent, inset 0 0 70px rgba(255,255,255,.22)}to{box-shadow:none}}

/* Nutrition */
.nutri{display:grid; gap:16px; width:100%; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); text-align:left}
@media(max-width:760px){.nutri{grid-template-columns:minmax(0,1fr)}}
.nutri h4{margin:0 0 10px}
.foods{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
.food{display:flex; flex-direction:column; gap:7px; padding:11px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.03); text-align:left; transition:.15s; position:relative}
.food:hover{border-color:var(--endu); background:rgba(255,255,255,.06); transform:translateY(-2px)}
.food:active{transform:scale(.97)}
.food[disabled]{opacity:.4; cursor:not-allowed; transform:none}
.food b{font-size:13px; font-weight:700}
.dots{display:flex; gap:8px; font:500 10.5px var(--f-mono); color:var(--muted); flex-wrap:wrap}
.dots i{font-style:normal}
.dots i::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--k); margin-right:3px}
.goal{padding:12px 14px; border-radius:14px; background:rgba(180,140,255,.1); border:1px solid rgba(180,140,255,.35); display:flex; flex-direction:column}
.goal b{font:800 italic 24px/1.1 var(--f-display); text-transform:uppercase}
.goal small{color:var(--muted); font-size:12px}
.macro{display:grid; grid-template-columns:92px minmax(0,1fr) 54px; gap:10px; align-items:center; font-size:12.5px}
.macro .bar{height:9px; overflow:visible; --c:var(--k)}
.macro .bar>i{border-radius:99px}
.macro .tg{position:absolute; top:-4px; bottom:-4px; width:3px; border-radius:3px; background:#fff; box-shadow:0 0 8px #fff; left:var(--t)}
.macro .nv{font:600 12px var(--f-mono); text-align:right; color:var(--muted)}
.macro.ok .nv{color:var(--ok)}
.plate{display:flex; gap:8px}
.slot{flex:1; aspect-ratio:1; max-width:62px; border-radius:50%; border:1.5px dashed var(--line-2); display:grid; place-items:center; font:800 italic 20px var(--f-display); background:rgba(255,255,255,.02); color:var(--dim); transition:.15s}
.slot.f{border-style:solid; border-color:var(--endu); background:rgba(180,140,255,.18); color:var(--fg); box-shadow:0 0 18px -4px var(--endu)}
.slot.f:hover{border-color:var(--bad); background:rgba(255,84,112,.2)}
.quality{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--muted)}
.quality b{font:800 italic 34px/1 var(--f-display); color:var(--fg)}

/* ---------- Résultat ---------- */
.result{--c:var(--accent); padding:clamp(20px,4vw,36px); text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px; position:relative; overflow:hidden; animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.result::before{content:""; position:absolute; inset:-40% 0 auto 0; height:90%; background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--c) 30%,transparent),transparent 65%)}
.result>*{position:relative}
.result h2{margin:0; font:800 italic clamp(34px,7vw,56px)/1 var(--f-display); text-transform:uppercase; letter-spacing:.02em}
.rows{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; width:100%; max-width:640px}
.rbox{padding:12px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--line)}
.rbox small{display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.rbox b{font:700 22px var(--f-mono)}
.gainbox{width:100%; max-width:520px; padding:16px 18px; border-radius:16px; background:color-mix(in srgb,var(--c) 10%,transparent); border:1px solid color-mix(in srgb,var(--c) 40%,transparent); text-align:left}
.gainbox .gl{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.gainbox .gl b{font:800 italic 40px/1 var(--f-display); color:var(--c); text-shadow:0 0 22px var(--c)}
.gainbox .gl span{font-size:13px; color:var(--muted)}
.gainbox .bar{--c:var(--c)}
.newrec{padding:5px 14px; border-radius:99px; font-size:11.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#1b1200; background:linear-gradient(135deg,var(--gold),#ff9d4a); box-shadow:0 0 30px -4px var(--gold); animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

/* ---------- Boutique ---------- */
.shop{display:flex; flex-direction:column; gap:14px}
.slotbox{padding:18px; display:flex; flex-direction:column; gap:14px}
.slothd{display:flex; align-items:center; gap:12px}
.slothd h3{margin:0; font:800 italic 24px/1 var(--f-display); text-transform:uppercase; letter-spacing:.03em}
.slothd .gic{width:42px;height:42px;border-radius:12px}
.slothd .gic svg{width:22px;height:22px}
.tiers{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tier{padding:14px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.03); display:flex; flex-direction:column; gap:8px; position:relative}
.tier.eq{border-color:rgba(95,242,208,.5); background:rgba(95,242,208,.07); box-shadow:0 0 28px -12px var(--accent)}
.tier.old{opacity:.5}
.tier.lock{opacity:.55}
.tier .tn{font-weight:800; font-size:14px}
.tier .tl{font-size:10.5px; letter-spacing:.14em; font-weight:800; color:var(--dim); text-transform:uppercase}
.bonuses{display:flex; gap:6px; flex-wrap:wrap}
.bonus{font:600 11.5px var(--f-mono); padding:3px 8px; border-radius:8px; background:rgba(255,255,255,.06); color:var(--ok)}
.price{font:700 18px var(--f-mono); color:var(--gold)}
.tier .btn{margin-top:auto}

/* ---------- Compétitions ---------- */
.comps{display:flex; flex-direction:column; gap:12px}
.comp{padding:18px; display:grid; gap:16px; grid-template-columns:auto minmax(0,1fr) auto; align-items:center}
@media(max-width:760px){.comp{grid-template-columns:auto minmax(0,1fr)} .comp .cact{grid-column:1/-1}}
.comp.lock{opacity:.6}
.medal{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:var(--gold);background:rgba(255,204,85,.1);border:1px solid rgba(255,204,85,.35)}
.medal svg{width:28px;height:28px}
.comp.lock .medal{color:var(--dim); background:rgba(255,255,255,.04); border-color:var(--line)}
.comp h3{margin:0; font:800 italic 24px/1.05 var(--f-display); text-transform:uppercase}
.comp .pl{color:var(--muted); font-size:12.5px; margin-bottom:8px}
.wchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.wchip{font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; border:1px solid color-mix(in srgb,var(--c) 45%,transparent); color:var(--c); background:color-mix(in srgb,var(--c) 10%,transparent)}
.req{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); max-width:380px}
.req .bar{flex:1; height:7px}
.cact{display:flex; flex-direction:column; align-items:flex-end; gap:8px; text-align:right}
.chance{font:800 italic 34px/1 var(--f-display)}
.chance small{display:block; font:600 10.5px var(--f-body); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.prize{font:700 14px var(--f-mono); color:var(--gold)}
.badge{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:99px}
.badge.g{background:rgba(255,204,85,.15); color:var(--gold)} .badge.s{background:rgba(200,215,240,.15); color:#d4deef} .badge.b{background:rgba(255,140,80,.15); color:#ff9d6a}

/* Course */
.race{padding:clamp(16px,3vw,26px); display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden; --c:var(--accent)}
.lanes{display:flex; flex-direction:column; gap:8px}
.lane{display:grid; grid-template-columns:104px minmax(0,1fr) 62px; gap:10px; align-items:center; font-size:12.5px}
@media(max-width:520px){.lane{grid-template-columns:78px minmax(0,1fr) 46px; font-size:11.5px}}
.lane .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted)}
.lane.me .nm{color:var(--accent); font-weight:800}
.track{position:relative; height:14px; border-radius:99px; background:rgba(255,255,255,.06); border-right:3px solid #fff}
.track i{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:99px; background:linear-gradient(90deg,transparent,var(--dim))}
.lane.me .track i{background:linear-gradient(90deg,transparent,var(--accent)); box-shadow:0 0 16px var(--accent)}
.track u{position:absolute; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:var(--dim); text-decoration:none}
.lane.me .track u{background:#fff; box-shadow:0 0 14px var(--accent)}
.lane .ps{font:700 12px var(--f-mono); text-align:right; color:var(--muted)}
.podium{display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:10px; align-items:end; width:100%; max-width:560px}
.pcol{border-radius:14px 14px 0 0; padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02)); border:1px solid var(--line)}
.pcol.p1{min-height:150px; border-color:rgba(255,204,85,.6); box-shadow:0 0 40px -10px var(--gold)} .pcol.p2{min-height:120px} .pcol.p3{min-height:96px}
.pcol b{font:800 italic 34px/1 var(--f-display)} .pcol.p1 b{color:var(--gold)}
.pcol span{font-size:12px; font-weight:700; word-break:break-word} .pcol small{font:500 11px var(--f-mono); color:var(--muted)}
.pcol.me{outline:2px solid var(--accent)}

/* ---------- Quota ---------- */
.qbanner{display:flex; align-items:center; gap:16px; padding:14px 18px; margin-bottom:14px; flex-wrap:wrap}
.qbanner .pips i{width:16px; height:16px; border-radius:5px}
.qbanner b{display:block; font-size:14px}
.qbanner span{font-size:12.5px; color:var(--muted)}
/* ---------- Nouveaux mini-jeux ---------- */
.cv.tall{width:min(360px,100%); aspect-ratio:6/7}
.cv.aim{cursor:none; touch-action:none}
.dotsrow{display:flex; gap:10px}
.dotsrow i{width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.1); border:1px solid var(--line-2)}
.dotsrow i.perfect{background:var(--accent); box-shadow:0 0 12px var(--accent)}
.dotsrow i.ok{background:var(--gold)} .dotsrow i.fail{background:var(--bad)}
.liftmeter{position:relative; width:min(520px,100%); height:36px; border-radius:99px; background:rgba(255,255,255,.07); border:1px solid var(--line); overflow:hidden}
.lzone{position:absolute; top:0; bottom:0; background:rgba(75,227,160,.28); border-inline:2px solid var(--ok)}
.lcur{position:absolute; top:0; bottom:0; width:5px; margin-left:-2px; background:#fff; box-shadow:0 0 14px #fff,0 0 30px var(--c)}
.reflex{width:min(520px,100%); height:min(240px,42vw); min-height:170px; border-radius:24px; border:1px solid var(--line-2); font:800 italic clamp(28px,6vw,50px) var(--f-display); text-transform:uppercase; color:var(--fg); touch-action:manipulation; transition:background .08s}
.reflex.wait{background:rgba(255,84,112,.2); border-color:rgba(255,84,112,.5)}
.reflex.go{background:rgba(75,227,160,.92); color:#04120f; box-shadow:0 0 90px var(--ok)}
.reflex.show{background:rgba(78,166,255,.22); border-color:var(--speed)}
.reflex.early{background:rgba(255,122,69,.3); border-color:var(--force)}
.beam{position:relative; width:min(560px,100%); height:72px; border-radius:18px; background:rgba(255,255,255,.04); border:1px solid var(--line); overflow:hidden; transition:background .15s}
.beam.fall{background:rgba(255,84,112,.22)}
.bzone{position:absolute; top:0; bottom:0; left:35%; width:30%; background:rgba(70,224,138,.14); border-inline:2px dashed var(--agi)}
.bmark{position:absolute; top:50%; left:50%; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,var(--agi)); box-shadow:0 0 26px var(--agi)}
.bmark.warn{background:radial-gradient(circle at 35% 30%,#fff,var(--bad)); box-shadow:0 0 26px var(--bad)}
.simon{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:min(360px,100%)}
.spad{--c:var(--accent); aspect-ratio:1.25; border-radius:22px; border:1px solid color-mix(in srgb,var(--c) 50%,transparent); background:color-mix(in srgb,var(--c) 14%,transparent); font:800 italic 44px var(--f-display); color:var(--c); touch-action:manipulation; transition:background .08s, box-shadow .08s, transform .08s}
.spad.lit{background:var(--c); color:#07101a; box-shadow:0 0 60px var(--c); transform:scale(.96)}
.status{font:800 italic 26px var(--f-display); letter-spacing:.06em; text-transform:uppercase; min-height:32px}

/* ---------- Refonte : coffres, loots, performance ---------- */
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.chip.dchip{font-size:11px}
.qbanner.prep{align-items:center}
.lootgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.lootc{text-align:center; padding:9px 2px; border-radius:12px; border:1px solid color-mix(in srgb,var(--r) 45%,transparent); background:color-mix(in srgb,var(--r) 10%,transparent)}
.lootc b{display:block; font:700 16px var(--f-mono); color:var(--r)}
.lootc span{font-size:9.5px; color:var(--muted); letter-spacing:.03em}
.chests{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.chest{padding:18px; display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden; transition:.25s}
.chest::before{content:""; position:absolute; width:220px; height:220px; right:-90px; top:-90px; border-radius:50%; background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
.chest>*{position:relative}
.chest:hover{transform:translateY(-3px); border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.chest h3{margin:0; font:800 italic 26px/1 var(--f-display); text-transform:uppercase}
svg.cs{width:130px; height:112px; margin:2px auto; overflow:visible; filter:drop-shadow(0 0 18px color-mix(in srgb,var(--c) 55%,transparent))}
.cs .lid{fill:color-mix(in srgb,var(--c) 70%,#150f0a)} .cs .bd{fill:color-mix(in srgb,var(--c) 42%,#150f0a)} .cs .bn{fill:var(--c)} .cs .lk{fill:#fff}
.cs .lidg{transform-box:fill-box; transform-origin:0 100%; transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.odds{display:flex; flex-direction:column; gap:5px}
.odd{display:flex; align-items:center; gap:8px; font-size:12.5px}
.odd i{width:9px; height:9px; border-radius:3px; background:var(--r); box-shadow:0 0 8px var(--r)}
.odd span{color:var(--muted); flex:1}
.odd b{font:600 12px var(--f-mono); color:var(--r)}
.lootlog{display:flex; flex-wrap:wrap; gap:8px}
.lg{font-size:12px; padding:5px 10px; border-radius:99px; border:1px solid color-mix(in srgb,var(--r) 55%,transparent); background:color-mix(in srgb,var(--r) 10%,transparent)}
.lg b{color:var(--r); font-weight:700}
.chestscene{padding:clamp(18px,4vw,34px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; min-height:540px; position:relative; overflow:hidden}
.chestscene::before{content:""; position:absolute; inset:-20% -10% auto -10%; height:80%; background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--c) 26%,transparent),transparent 65%)}
.chestscene>*{position:relative}
.chestbox svg.cs{width:min(250px,60vw); height:auto}
.chestbox.shake{animation:shk .12s linear infinite}
@keyframes shk{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,1px) rotate(-2deg)}50%{transform:translate(3px,-1px) rotate(2deg)}75%{transform:translate(-2px,2px) rotate(-1deg)}100%{transform:translate(0,0)}}
.chestbox.open .lidg{transform:rotate(-34deg) translate(-4px,-6px)}
.chestbox.open svg.cs{filter:drop-shadow(0 0 60px var(--c))}
.rv{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; width:100%; max-width:820px}
.lcard{--r:#9aa7bd; padding:16px 12px; text-align:center; border-radius:18px; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--fg);
  border:1px solid color-mix(in srgb,var(--r) 70%,transparent); background:linear-gradient(180deg,color-mix(in srgb,var(--r) 22%,transparent),color-mix(in srgb,var(--r) 6%,transparent));
  box-shadow:0 0 40px -8px var(--r); animation:cardin .7s cubic-bezier(.2,1.2,.3,1) both}
.lcard small{font-size:10.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--r)}
.lcard b{font:800 italic 21px/1.1 var(--f-display); text-transform:uppercase}
.lcard .lv{font:700 15px var(--f-mono)}
.lcard svg{color:var(--r)}
@keyframes cardin{from{opacity:0; transform:translateY(24px) scale(.7) rotateY(90deg)}to{opacity:1; transform:none}}
.flash-m{position:fixed; inset:0; pointer-events:none; z-index:60; background:radial-gradient(circle at 50% 45%,rgba(255,77,106,.7),rgba(255,204,85,.25) 40%,transparent 70%); animation:fm 1.2s ease-out forwards}
@keyframes fm{from{opacity:1}to{opacity:0}}
.perfring{position:relative; width:min(200px,50vw); aspect-ratio:1}
.perfring svg{width:100%; height:100%; transform:rotate(-90deg); overflow:visible}
.perfring .trk{fill:none; stroke:rgba(255,255,255,.07); stroke-width:7}
.perfring .prg{fill:none; stroke:var(--pc); stroke-width:7; stroke-linecap:round; filter:drop-shadow(0 0 8px var(--pc)); transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.perfring .pn{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.perfring .pn b{font:800 italic 64px/1 var(--f-display)}
.perfring .pn small{font-size:9.5px; letter-spacing:.12em; color:var(--muted); font-weight:700}
.reflex.decoy{background:rgba(255,204,85,.3); border-color:var(--gold)}
.timer svg{overflow:visible}

.stroop{font:800 italic clamp(54px,13vw,96px)/1 var(--f-display); letter-spacing:.04em; min-height:1.1em; text-shadow:0 0 30px currentColor}
.stroop.bad{animation:shk .2s linear 1}
.simon.fp{width:min(460px,100%)}
.simon.fp .spad{aspect-ratio:2.4; font-size:22px; font-style:normal}

.srow .bar::after{content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(6,10,17,.75) calc(10% - 1px) 10%)}

.cbadge{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--bad); color:#fff; font:700 11px var(--f-mono); margin-left:8px}
.rwd{display:flex; align-items:center; gap:18px; width:100%; max-width:520px}
.rwd svg.cs{width:96px; height:auto}
.rwd .rn{display:block; font:800 italic 28px/1.1 var(--f-display); text-transform:uppercase; color:var(--c)}
.rwd span{font-size:13px; color:var(--muted)}

/* ---------- Salle de sport ---------- */
.gymwrap{border-radius:20px; overflow:hidden; border:1px solid var(--line); background:#0b1326; box-shadow:0 24px 60px -30px #000}
svg.gym{display:block; width:100%; height:auto}
svg.gym text{font-family:var(--f-body)}
svg.gym .neon{font:800 italic 50px var(--f-display); letter-spacing:6px; fill:#5ff2d0}
svg.gym .sgn{font:800 italic 21px var(--f-display); letter-spacing:3px}
svg.gym .ntag{font:700 13px var(--f-body); fill:#e9eefb; letter-spacing:.06em; text-transform:uppercase; paint-order:stroke; stroke:rgba(6,10,17,.8); stroke-width:4px}
svg.gym .hs{cursor:pointer; outline:none}
svg.gym .hs .hl{fill:rgba(95,242,208,0); stroke:#5ff2d0; stroke-width:3; stroke-dasharray:8 6; opacity:0; transition:opacity .2s, fill .2s}
svg.gym .hs:hover .hl, svg.gym .hs:focus-visible .hl{opacity:1; fill:rgba(95,242,208,.07)}
svg.gym .hs .art{transition:filter .2s}
svg.gym .hs:hover .art, svg.gym .hs:focus-visible .art{filter:brightness(1.22)}
svg.gym .hs .tag{opacity:0; transform:translateY(6px); transition:opacity .2s, transform .2s; pointer-events:none}
svg.gym .hs .tag rect{fill:#0b1326; stroke:#5ff2d0; stroke-width:1.5}
svg.gym .hs .tag text{fill:#e9eefb; font-size:13px; font-weight:700}
svg.gym .hs:hover .tag, svg.gym .hs:focus-visible .tag{opacity:1; transform:none}
svg.gym .badge{pointer-events:none}
svg.gym .glowpulse{animation:glowp 1.8s ease-in-out infinite}
@keyframes glowp{50%{opacity:.35}}
.gymcards{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-top:14px}
.gc2{--c:var(--accent); display:flex; align-items:center; gap:14px; text-align:left; padding:14px 16px; border-radius:16px; border:1px solid color-mix(in srgb,var(--c) 40%,transparent); background:color-mix(in srgb,var(--c) 9%,transparent); color:var(--fg); transition:.2s}
.gc2 svg{color:var(--c); flex:none}
.gc2:hover{transform:translateY(-2px); background:color-mix(in srgb,var(--c) 16%,transparent)}
.gc2 b{display:block; font:800 italic 20px/1.1 var(--f-display); text-transform:uppercase}
.gc2 small{display:block; color:var(--muted); font-size:12.5px}

svg.gym .bt{font:700 13px var(--f-body); letter-spacing:.08em}
svg.gym .bv{font:700 13px var(--f-mono); fill:#e9eefb}
svg.gym .bl{font:700 11px var(--f-body)}
svg.gym .bn{font:800 italic 22px var(--f-display); fill:#e9eefb; letter-spacing:.04em}
svg.gym .bh{font:700 11px var(--f-body); letter-spacing:.1em; fill:#5ff2d0}
svg.gym .bs{font:700 10px var(--f-body); letter-spacing:.2em; fill:#7f93b8}
svg.gym .bb{font:800 10px var(--f-body); fill:#d9c7ff; letter-spacing:.06em}
@media (min-width:900px){
  /* mode salle : la scène occupe tout le jeu, les stats sont dans le décor */
  body.hubmode .shell{max-width:1560px}
  body.hubmode .layout{grid-template-columns:minmax(0,1fr)}
  body.hubmode #tabs, body.hubmode .gymcards, body.hubmode .gymhint{display:none}
  body.hubmode .side > :not(.tuner){display:none}
  body.hubmode .side{position:fixed; right:16px; bottom:16px; width:min(340px,calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; z-index:40; display:block}
  body.hubmode .tuner{background:rgba(11,19,38,.92)}
  body.hubmode .gymwrap{height:calc(100vh - 126px); min-height:520px; display:grid; place-items:center; background:linear-gradient(180deg,#16213f,#0b1326 62%,#0a0f1c)}
  body.hubmode svg.gym{height:100%; width:100%}
}

/* ---------- Plus de barre latérale : la scène est la navigation ---------- */
body .layout{display:block}
body .side{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); width:min(340px,calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; z-index:40}
body .tuner{background:rgba(11,19,38,.94)}
body:not(.hubmode) #stage{width:100%; max-width:1240px; margin-inline:auto}
.homebar{margin-bottom:14px}
.tuner .nameIn{width:100%; background:rgba(255,255,255,.06); border:1px solid var(--line-2); border-radius:8px; color:var(--fg); padding:5px 8px; font:600 13px var(--f-body); text-transform:none; letter-spacing:0}
.nrow input{grid-column:2 / 4}
@media (max-width:899px){
  .gymwrap{overflow-x:auto}
  svg.gym{min-width:880px}
}

.beamtxt{position:absolute; inset:0; display:grid; place-items:center; font:800 italic 30px var(--f-display); color:var(--bad); letter-spacing:.12em; pointer-events:none}
.windrow{display:flex; align-items:center; gap:10px; width:min(560px,100%); font-size:11px; letter-spacing:.14em; color:var(--muted); font-weight:700}
.windbar{position:relative; flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.08)}
.windbar::before{content:""; position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:var(--line-2)}
.windbar i{position:absolute; top:0; bottom:0; background:var(--agi); border-radius:3px; box-shadow:0 0 10px var(--agi)}

/* ---------- Défi du jour ---------- */

const KEY = 'apex-athlete-v2';

const defaults = () => ({
  perfect:{},
  daily:{ date:'', scores:[null, null, null, null, null], humans:[], cur:-1, streak:0, last:'', hist:[], result:null },
  name:'Alex Moreau', muted:false, theme:'auto', vol:55, avatar:{ skin:'#d9a98a', hair:'#1a1f2e', style:'court', shirt:0, shorts:'#14203a', band:'#5ff2d0', plates:'#ff7a45', equip:[] }, pts:0, items:{}, sessions:0,
  stats:{ force:0, speed:0, endurance:0, agility:0, precision:0, mental:0 }
});
function hydrate(o) {   // complète une sauvegarde (locale ou en ligne) avec les valeurs par défaut
  const d = defaults(); o = o && typeof o === 'object' ? o : {};
  const s = Object.assign(d, o, { stats:Object.assign(d.stats, o.stats), items:Object.assign({}, o.items), avatar:Object.assign(d.avatar, o.avatar), daily:Object.assign(d.daily, o.daily) });
  STAT_KEYS.forEach(k => { s.stats[k] = clamp(+s.stats[k] || 0, 0, 100); });
  return s;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return hydrate(JSON.parse(raw)); } catch (e) {}
  return hydrate(null);
}
let S = load();
const snap = () => { const o = Object.assign({}, S); delete o.t; return JSON.stringify(o); };   // contenu de la partie, sans l'horodatage
let lastSnap = snap();
function save() {
  const s = snap(); if (s !== lastSnap) { lastSnap = s; S.t = Date.now(); }   // S.t : date de la dernière modification (sert à la synchro)
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  cloudQueue();
}

/* =====================================================================
   3. AUDIO — effets synthétisés Web Audio
   ===================================================================== */
const Sfx = {
  ctx:null, master:null,
  init() {
    try {
      if (!this.ctx) {
        const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
        this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = (S.vol == null ? 55 : S.vol) / 100; this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  tone(f, d = .1, type = 'sine', v = .15, delay = 0, slideTo = null) {
    if (S.muted || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .03);
  },
  count()  { this.tone(520, .16, 'square', .1); },
  go()     { this.tone(1040, .4, 'square', .12); this.tone(1560, .4, 'triangle', .08); },
  rep(p=0) { this.tone(260 + Math.min(p, 10) * 28, .06, 'triangle', .12); },
  step(a)  { this.tone(a ? 640 : 520, .045, 'square', .055); },
  metro()  { this.tone(190, .07, 'sine', .22, 0, 95); },
  hit(q)   { this.tone(q === 'perfect' ? 1250 : q === 'good' ? 940 : 620, .09, 'triangle', .13); },
  bad()    { this.tone(150, .15, 'sawtooth', .07, 0, 90); },
  ok()     { this.tone(660, .1, 'sine', .14); this.tone(990, .2, 'sine', .14, .09); },
  coin()   { this.tone(1318, .07, 'square', .07); this.tone(1760, .2, 'square', .07, .07); },
  pick()   { this.tone(740, .06, 'triangle', .1); },
  bell()   { [1, 2.76, 5.4, 8.93].forEach((m, i) => this.tone(740 * m, 1.9 / (i + 1), 'sine', .16 / (i + 1))); },
  fanfare(){ [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .28, 'triangle', .14, i * .11)); this.tone(1046, .8, 'triangle', .12, .46); },
  rumble() { for (let i = 0; i < 10; i++) this.tone(70 + Math.random() * 30, .18, 'sawtooth', .09, i * .13, 45); },
  pop()    { this.tone(300, .25, 'sine', .2, 0, 900); },
  reveal(i){ const b = [392, 494, 587, 784, 1046][i] || 392; this.tone(b, .18, 'triangle', .14); this.tone(b * 1.5, .3, 'sine', .1, .08); if (i >= 3) this.tone(b * 2, .5, 'triangle', .1, .16); },
  mythic() { this.fanfare(); [1, 1.5, 2, 3].forEach((m, k) => this.tone(523 * m, 1.2, 'sawtooth', .05, .3 + k * .1)); }
};
window.addEventListener('pointerdown', () => Sfx.init(), { capture:true });
window.addEventListener('keydown', () => Sfx.init(), { capture:true });

  v = clamp(parseFloat(v) || 0, 0, 100);
  S.stats[k] = v; updateSide(); save();

function go(v) {
  dClean();

}

const AV_SCALE = 210 / 1640;   // l'image fait 920 × 1640 : le personnage mesure 210 unités de haut, pieds à y = 0, centré en x = 0
function athleteBody(av) {
  const has = id => av.equip.includes(id), band = av.band;
  const strap = (cx, cy, rot, w) => `<rect x="${cx - w / 2}" y="${cy - 12}" width="${w}" height="26" rx="9" fill="${band}" transform="rotate(${rot} ${cx} ${cy})"/>`;
  const sock = (x, y, w) => `<rect x="${x}" y="${y}" width="${w}" height="36" rx="13" fill="#eaf7ff"/><rect x="${x}" y="${y}" width="${w}" height="10" rx="5" fill="${band}"/>`;
  const body = (has('serviette') ? `<path d="M205 306L338 262L352 306L258 480L190 470Z" fill="#f2f6fc"/><path d="M214 392L318 350" stroke="${band}" stroke-width="16"/>` : '')
    + (has('medaille') ? `<path d="M385 314L440 522L500 314" stroke="#ff5470" stroke-width="16" fill="none" stroke-linejoin="round"/><circle cx="440" cy="528" r="34" fill="#ffcc55" stroke="#b8860b" stroke-width="6"/><circle cx="440" cy="528" r="14" fill="#b8860b"/>` : '')
    + (has('ceinture') ? `<rect x="262" y="798" width="364" height="30" rx="8" fill="#ffcc55"/><rect x="420" y="790" width="54" height="44" rx="9" fill="#ff5470" stroke="#fff" stroke-width="4"/>` : '')
    + (has('chaussettes') ? sock(222, 1514, 118) + sock(610, 1512, 126) : '')
    + (has('poignets') ? strap(68, 796, 28, 90) : '');
  const head = has('couronne') ? `<path d="M375 32L370 -28L405 6L442 -42L480 6L515 -28L510 32Z" fill="#ffcc55" stroke="#b8860b" stroke-width="5" stroke-linejoin="round"/><circle cx="442" cy="-2" r="9" fill="#ff5470"/>`
    : has('bonnet') ? `<path d="M352 92Q352 -40 442 -40Q532 -40 532 92Z" fill="${band}"/><rect x="348" y="58" width="188" height="38" rx="12" fill="rgba(255,255,255,.3)"/><circle cx="442" cy="-50" r="26" fill="#f2f6fc"/>`
    : has('casquette') ? `<path d="M356 78Q356 -18 442 -18Q528 -18 528 78Z" fill="${band}"/><ellipse cx="442" cy="82" rx="110" ry="17" fill="${band}"/><ellipse cx="442" cy="90" rx="108" ry="9" fill="rgba(0,0,0,.28)"/>`
    : has('serretete') ? `<path d="M358 86Q442 54 528 86" fill="none" stroke="${band}" stroke-width="28" stroke-linecap="round"/>` : '';
  const shades = has('lunettes') ? `<g fill="#0b1020"><rect x="364" y="98" width="72" height="46" rx="19"/><rect x="430" y="98" width="72" height="46" rx="19"/><rect x="428" y="106" width="6" height="8"/></g><path d="M366 110L350 104M500 110L518 104" stroke="#0b1020" stroke-width="7" stroke-linecap="round"/><path d="M376 108Q388 104 398 108M442 108Q454 104 464 108" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".45"/>` : '';
  return `<g transform="translate(${-460 * AV_SCALE} -210) scale(${AV_SCALE})"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" repeatCount="indefinite"/>
    <use href="#hoaBody"/>${body}
    <circle cx="735" cy="585" r="38" fill="rgb(30,32,37)"/>
    <g><animateTransform attributeName="transform" type="rotate" values="0 735 585;135 735 585;0 735 585" keyTimes="0;.5;1" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1" dur="2.6s" repeatCount="indefinite"/>

          <div class="swrow" data-k="band"><small>Accessoires</small>${ACCENTS.map(c => `<button type="button" class="sw" data-v="${c}" style="background:${c}" aria-label="Accent ${c}"></button>`).join('')}</div>
          <div class="swrow" data-k="plates"><small>Haltère</small>${PLATES.map(c => `<button type="button" class="sw" data-v="${c}" style="background:${c}" aria-label="Haltère ${c}"></button>`).join('')}</div>
        </div></div>
      </div>
    <div class="setrow"><span class="label">Son</span>
      <div class="seg" id="setSound"><button type="button" data-v="on" aria-pressed="${!S.muted}">Activé</button><button type="button" data-v="off" aria-pressed="${!!S.muted}">Coupé</button></div>
      <div class="volrow"><input type="range" id="setVol" min="0" max="100" step="5" aria-label="Volume"><output id="setVolOut"></output></div></div>
    <div class="setrow"><span class="label">Thème</span><div class="seg" id="setTheme">${THEMES.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${(S.theme || 'auto') === v}">${l}</button>`).join('')}</div></div>
    <div class="setrow"><span class="label">Partie</span><button class="btn ghost danger" id="btnReset" data-act="reset" type="button">Réinitialiser la partie</button></div>
    <div class="btnrow"><button class="btn" data-act="closeset" type="button">Fermer</button></div><small style="color:var(--dim);text-align:center">Version 56 · classement dans la salle</small></div>`;
  document.body.appendChild(o);
  const name = $('#setName'), vol = $('#setVol'), out = $('#setVolOut');
  name.value = S.name; vol.value = S.vol == null ? 55 : S.vol; out.textContent = vol.value + ' %';
  name.addEventListener('input', () => { S.name = name.value.trim() || 'Athlète'; save(); if (view === 'hub') { clearTimeout(refreshT); refreshT = setTimeout(viewHub, 300); } });
  vol.addEventListener('input', () => { setVol(vol.value); out.textContent = vol.value + ' %'; save(); });
  vol.addEventListener('change', () => { Sfx.init(); if (!S.muted) Sfx.ok(); });
  const seg = (id, fn) => $('#' + id).addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return; $('#' + id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); fn(b.dataset.v); });
  seg('setSound', v => { S.muted = v === 'off'; updateHud(); save(); if (!S.muted) { Sfx.init(); Sfx.ok(); } });
  seg('setTheme', v => { S.theme = v; applyTheme(); save(); });
  o.addEventListener('mousedown', e => { if (e.target === o) closeSettings(); });
  const avRender = () => {
    const av = avOf();
    $('#avPrev').innerHTML = `<ellipse cx="0" cy="4" rx="46" ry="8" fill="#000" opacity=".35"/>${athleteBody(av)}`;
    o.querySelectorAll('.swrow').forEach(r => r.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', String(av[r.dataset.k]) === b.dataset.v)));
  }, avSet = patch => { S.avatar = Object.assign(avOf(), patch); save(); avRender(); if (view === 'hub') { clearTimeout(refreshT); refreshT = setTimeout(viewHub, 250); } };
  o.querySelectorAll('.swrow').forEach(r => r.addEventListener('click', e => { const b = e.target.closest('.sw'); if (b) avSet({ [r.dataset.k]: b.dataset.v }); }));
  avRender(); acctRender();
  name.focus();
}
document.addEventListener('keydown', e => { // les éléments de la salle se pilotent aussi au clavier
  if (e.key === 'Escape' && $('#setov')) { closeSettings(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.hs')) { e.preventDefault(); gymGo(e.target.dataset.to); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'settings') openSettings();
  else if (a === 'closeset') closeSettings();
  else if (a === 'back') go(lastTab);
  else if (a === 'gym') gymGo(b.dataset.to);
  else if (a === 'home') go('hub');
  else if (a === 'dstart') dailyStart(+b.dataset.i);
  else if (a === 'dgo') dailyBegin();
  else if (a === 'dnext') dailyAdvance();
  else if (a === 'dback') viewDaily();
  else if (a === 'dquit') dailyQuit();
  else if (a === 'dcopy') { const t = dailyShareText(); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('Résultat copié.'), () => toast('Sélectionne le texte pour le copier.', 'bad')); else toast('Sélectionne le texte pour le copier.', 'bad'); }
  else if (a === 'buy') buyItem(b.dataset.id, b.dataset.v);
  else if (a === 'acc') toggleAcc(b.dataset.id);
  else if (a === 'rankrefresh') viewRank();
  else if (a === 'mute') { S.muted = !S.muted; updateHud(); save(); if (!S.muted) Sfx.ok(); }
  else if (a === 'reset') {
    if (!resetArmed) { resetArmed = true; b.classList.add('armed'); b.textContent = 'Confirmer ?'; resetT = setTimeout(disarm, 3000); }
    else { clearTimeout(resetT); try { localStorage.removeItem(KEY); } catch (er) {} S = hydrate(null); if (AUTH) S.uid = AUTH.user.id; closeSettings(); applyTheme(); refreshAll(); go('hub'); toast('Nouvelle carrière lancée.'); }
  }
});

/* =====================================================================
   9. DÉMARRAGE
   ===================================================================== */
applyTheme(); buildSide(); buildTabs(); updateHud(); updateSide(); go('hub'); cloudStart();
setInterval(() => { updateHud(); const dn = $('#dNext'); if (dn) dn.textContent = untilMidnight(); }, 1000);
setInterval(save, 5000);
window.addEventListener('beforeunload', save);
})();
</script>
